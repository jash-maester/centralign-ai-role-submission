[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    crm: needs a seeded EspoCRM (make up && make seed)
    browser: runs inside the Playwright image (make test-browser)
    live_llm: calls OpenRouter; only with LLM_LIVE_TESTS=1 (make test-live)
    e2e: drives the full compose stack
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
